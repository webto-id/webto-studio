# Where each artifact lives inside projects/<slug>/, and the schema that checks it.
# `{bundle}` is the pipeline's bundle folder: `site` or `template`.
# `{stage}` is the stage being checkpointed.
preflight:
  path: reports/preflight.json
brief:
  path: brief.json
  schema: brief
content_inventory:
  path: content_inventory.json
  schema: content_inventory
concept:
  path: concept.json
  schema: concept
site_plan:
  path: site_plan.json
  schema: site_plan
design_direction:
  path: design_direction.json
  schema: design_direction
seo_plan:
  path: seo_plan.json
  schema: seo_plan
assets_manifest:
  path: assets_manifest.json
  schema: assets_manifest
bundle:
  path: "{bundle}/{bundle}.json"
check_report:
  path: reports/check.json
  fresh: true # must describe the bundle as it is on disk right now
lock:
  path: "{bundle}/webto.lock.json"
shots:
  path: shots/index.json
motion:
  path: motion/index.json # required when the site moves (a motion library, a 3D page); judged again at the checkpoint
audit:
  path: reports/audit.json # judged again at the checkpoint against the plans as they are
review:
  path: "review/{stage}.json"
  schema: review
critique:
  path: critique # critique/pass-<n>.json, the latest pass counts
  schema: critique
listing:
  path: listing.json
  schema: listing
handoff:
  path: handoff.md
